name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export web (React Native Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages sirve este sitio en /<repo>/, no en la raíz del dominio. Sin este
      # baseUrl, el index.html generado pide el bundle en /_expo/static/js/... (ruta
      # absoluta a la raíz del dominio) -> 404 -> página en blanco. Lo lee app.config.ts.
      # El nombre del repo se toma del propio evento para no hardcodearlo.
      - name: Export web (expo export -p web)
        run: pnpm build:web
        env:
          INDIGO_WEB_BASE_URL: /${{ github.event.repository.name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
