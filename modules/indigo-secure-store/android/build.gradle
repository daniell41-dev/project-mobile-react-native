plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.daniell.indigo.modules.securestore'
version = '0.1.0'

android {
  namespace "dev.daniell.indigo.modules.securestore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.security:security-crypto:1.0.0'
}
