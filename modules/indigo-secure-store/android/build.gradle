plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.daniell.indigo.modules.securestore'
version = '0.1.0'

android {
  namespace "dev.daniell.indigo.modules.securestore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 1.0.0 (la última estable) no tiene MasterKey/MasterKey.Builder -- esa API llegó en la
  // línea 1.1.0-alpha (nunca se estabilizó del lado de Google, pero es la que expone la
  // forma moderna recomendada de EncryptedSharedPreferences.create(context, fileName,
  // masterKey, ...) que usa IndigoSecureStoreModule.kt). Confirmado real en CI: con 1.0.0,
  // ./gradlew compileDebugKotlin falla con "Unresolved reference 'MasterKey'".
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
