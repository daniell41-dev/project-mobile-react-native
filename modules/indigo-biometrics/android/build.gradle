plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.daniell.indigo.modules.biometrics'
version = '0.1.0'

android {
  namespace "dev.daniell.indigo.modules.biometrics"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.biometric:biometric:1.1.0'
  // Sin esto, ./gradlew test ni siquiera compila IndigoBiometricsModuleTest.kt --
  // "Unresolved reference 'junit'" en cada import de org.junit.*. Confirmado real en CI
  // (android.yml): faltaba en los 4 módulos con build.gradle propio (biometrics,
  // secure-store, card-view, connectivity), no solo en este.
  testImplementation 'junit:junit:4.13.2'
}
